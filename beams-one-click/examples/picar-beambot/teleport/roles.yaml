# Teleport roles for the PiCar-X BeamBot.   tctl create -f teleport/roles.yaml
#
# picar-viewer / picar-driver grant the MCP app picar-mcp (robot/teleport.yaml) and choose its tools.
# picar-stream grants the plain HTTP app picar-stream: live video, telemetry and a stop button, served on a
#   second port with no /mcp. Hand it out next to either tier when the dashboard should show video.
# beambot-data matches the optional databases (beambot-postgres, beambot-redis) by the same label.
#
# Why two kinds of grant: `mcp.tools` only filters MCP apps. A role that matched the stream app and the robot's
# MCP endpoint through one label would let a viewer POST `tools/call drive` through the HTTP app and bypass the
# tool list. So the MCP grants carry `teleport.internal/app-sub-kind: mcp` (they can only ever match MCP apps),
# and the HTTP app is on a port that serves nothing but read-only streams and `/stop`.
# Put the role on the *beam* with `--roles`; never let a beam inherit your admin roles.
# `mcp.tools` is what Teleport shows the agent in tools/list; anything not listed is invisible to it.
#
# NOTE: no `deny` rules on purpose. Teleport deny rules apply to the whole identity, so a deny in the
# viewer role would also block a driver grant that arrives through an access request.
kind: role
version: v8
metadata:
  name: picar-viewer
  description: See what the PiCar-X sees. Can always hit stop. Cannot drive, aim or speak.
spec:
  allow:
    app_labels:
      project: picar-beambot
      teleport.internal/app-sub-kind: mcp
    mcp:
      tools: [snapshot, get_telemetry, stop]
    request:
      roles: [picar-driver]
      reason:
        mode: required
  options:
    max_session_ttl: 8h
---
kind: role
version: v8
metadata:
  name: picar-driver
  description: Full control of the PiCar-X, time-boxed. Every call lands in the Teleport audit log.
spec:
  allow:
    app_labels:
      project: picar-beambot
      teleport.internal/app-sub-kind: mcp
    mcp:
      tools: [snapshot, get_telemetry, stop, look, drive, say]
  options:
    max_session_ttl: 1h
---
kind: role
version: v8
metadata:
  name: picar-stream
  description: Watch the PiCar-X video and telemetry (and hit stop) through the plain HTTP app. Cannot drive.
spec:
  allow:
    app_labels:
      project: picar-beambot
      surface: stream
  options:
    max_session_ttl: 8h
---
kind: role
version: v8
metadata:
  name: beambot-data
  description: Let the BeamBot dashboard store its counts in Postgres and its activity feed in Redis, nothing else.
spec:
  allow:
    db_labels:
      project: picar-beambot
    db_users: [app]
    db_names: [beambot]
  options:
    max_session_ttl: 8h
