[pytest]
python_files = test_*.py
testpaths = tests examples/picar-beambot
pythonpath = examples/picar-beambot/beam-app examples/picar-beambot/robot tests
addopts = -p no:cacheprovider -q
timeout = 180
markers =
    live: needs a real Teleport session (run inside a beam with BEAMS_LIVE=1); see tests/live/README.md
