# A simulated PiCar-X that is always on, inside your cluster, published through Teleport (see deploy.sh). Its /mcp has
# no tool filter of its own, so the NetworkPolicy at the end lets only the Teleport agent's namespace reach it. That
# holds only if your cluster's network plugin enforces NetworkPolicy (k3s does; minikube needs e.g. --cni=calico):
# without one, any pod in the cluster can call /mcp.
apiVersion: v1
kind: Namespace
metadata:
  name: picar-sim
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: picar-sim
  namespace: picar-sim
spec:
  replicas: 1            # one robot: it has a position, a heading and a camera, so don't scale it out
  selector:
    matchLabels: {app: picar-sim}
  template:
    metadata:
      labels: {app: picar-sim}
    spec:
      containers:
        - name: robot
          image: picar-sim:dev
          imagePullPolicy: IfNotPresent
          ports:
            - {name: mcp, containerPort: 8765}      # /mcp only
            - {name: stream, containerPort: 8766}   # video, telemetry, stop: no /mcp
          env:
            # The emergency-stop latch is saved here, so a restarted container comes back still latched.
            # An emptyDir survives container restarts, not a replaced pod: a new pod starts unlatched.
            - {name: HALT_FILE, value: /var/lib/picar-beambot/halted}
          volumeMounts:
            - {name: state, mountPath: /var/lib/picar-beambot}
          readinessProbe:
            httpGet: {path: /telemetry, port: stream}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /telemetry, port: stream}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      volumes:
        - {name: state, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: picar-sim
  namespace: picar-sim
spec:
  selector: {app: picar-sim}
  ports:
    - {name: mcp, port: 8765, targetPort: mcp}
    - {name: stream, port: 8766, targetPort: stream}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: picar-sim-teleport-agent-only
  namespace: picar-sim
spec:
  podSelector:
    matchLabels: {app: picar-sim}
  policyTypes: [Ingress]
  ingress:
    # deploy.sh installs the agent in the teleport-agent namespace (AGENT_NS) and nothing else runs there. The
    # kubelet's readiness and liveness probes come from the node, which NetworkPolicy doesn't block.
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: teleport-agent}
      ports:
        - {protocol: TCP, port: 8765}
        - {protocol: TCP, port: 8766}
