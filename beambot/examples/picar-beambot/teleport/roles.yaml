# Teleport roles for the PiCar-X BeamBot.   tctl create -f teleport/roles.yaml
#
# This release has ONE role that moves the car:
# picar-driver grants the MCP app picar-mcp (robot/teleport.yaml) and chooses its tools: everything except `resume`.
#   To hand an agent fewer tools, copy it under a new name and trim `mcp.tools`; Teleport hides what isn't listed.
# picar-stream grants the plain HTTP app picar-stream: live video, telemetry, stop and the dashboard's Resume button,
#   served on a second port with no /mcp. Give it to the dashboard's beam only.
# beambot-data matches the optional databases (beambot-postgres, beambot-redis) by the same label.
#
# Why two kinds of grant: `mcp.tools` only filters MCP apps. A role that matched the stream app and the robot's
# MCP endpoint through one label would put `/resume` (which the tool list withholds) in reach of any agent holding
# the role. So the MCP grant carries `teleport.internal/app-sub-kind: mcp` (it can only ever match MCP apps),
# and the HTTP app is on a port that serves nothing but read-only streams, `/stop`, `/release` and `/resume`.
#
# Emergency stop is a latch on the robot: the `stop` tool (and /stop) stops the car and refuses `drive` until someone
# resumes. Resuming is deliberately not in the picar-driver tool list, so an agent cannot clear the latch itself.
# It is part of picar-stream (POST /resume) and of the built-in mcp-user role (every tool). Give picar-stream to the
# dashboard's beam, not to a beam that runs Claude Code.
# Put the role on the *beam* with `--roles`; never let a beam inherit your admin roles.
# `mcp.tools` is what Teleport shows the agent in tools/list; anything not listed is invisible to it.
#
# NOTE: no `deny` rules on purpose. Teleport deny rules apply to the whole identity, so a deny in one role would
# also block a grant that arrives from another role.
kind: role
version: v8
metadata:
  name: picar-driver
  description: Full control of the PiCar-X, time-boxed. Every call lands in the Teleport audit log.
spec:
  allow:
    app_labels:
      project: picar-beambot
      teleport.internal/app-sub-kind: mcp
    mcp:
      tools: [snapshot, get_telemetry, stop, look, drive, say]
  options:
    max_session_ttl: 1h
---
kind: role
version: v8
metadata:
  name: picar-stream
  description: Watch the PiCar-X video and telemetry through the plain HTTP app, hit stop, and resume after a stop. Cannot drive.
spec:
  allow:
    app_labels:
      project: picar-beambot
      surface: stream
  options:
    max_session_ttl: 8h
---
kind: role
version: v8
metadata:
  name: beambot-data
  description: Let the BeamBot dashboard store its counts in Postgres and its activity feed in Redis, nothing else.
spec:
  allow:
    db_labels:
      project: picar-beambot
    db_users: [app]
    db_names: [beambot]
  options:
    max_session_ttl: 8h
